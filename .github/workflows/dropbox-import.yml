name: dropbox-import
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: 'JSON array of {"path": ..., "url": ...} entries to download'
        required: true
        type: string
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download files
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess
          for e in json.loads(os.environ["MANIFEST"]):
              subprocess.run(
                  ["curl", "-sSL", "--fail", "--create-dirs", "-o", e["path"], e["url"]],
                  check=True,
              )
          EOF
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import files from Dropbox" || echo "nothing to commit"
          git push
