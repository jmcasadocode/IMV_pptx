<script>
(function () {
    "use strict";

    const grafico = document.getElementById("heatmap-imv");
    const contenedor = document.querySelector(".contenedor-grafico");

    let ultimoAncho = 0;
    let animacionPendiente = null;

    function configuracionParaAncho(ancho) {
        if (ancho < 900) {
            return {
                "font.size": 14,
                "margin.l": 175,
                "margin.r": 45,
                "margin.t": 20,
                "margin.b": 140,
                "xaxis.tickangle": -60,
                "xaxis.tickfont.size": 11,
                "yaxis.tickfont.size": 11,
                "colorbar.tickfont.size": 11,
                "colorbar.thickness": 13,
                "colorbar.len": 0.80
            };
        }

        if (ancho < 1300) {
            return {
                "font.size": 18,
                "margin.l": 220,
                "margin.r": 55,
                "margin.t": 25,
                "margin.b": 150,
                "xaxis.tickangle": -50,
                "xaxis.tickfont.size": 14,
                "yaxis.tickfont.size": 14,
                "colorbar.tickfont.size": 13,
                "colorbar.thickness": 16,
                "colorbar.len": 0.84
            };
        }

        return {
            "font.size": 22,
            "margin.l": 260,
            "margin.r": 70,
            "margin.t": 35,
            "margin.b": 165,
            "xaxis.tickangle": -45,
            "xaxis.tickfont.size": 18,
            "yaxis.tickfont.size": 18,
            "colorbar.tickfont.size": 16,
            "colorbar.thickness": 18,
            "colorbar.len": 0.86
        };
    }

    function redimensionar() {
        const ancho = contenedor.clientWidth;

        if (!ancho || Math.abs(ancho - ultimoAncho) < 1) {
            return;
        }

        ultimoAncho = ancho;
        const cambios = configuracionParaAncho(ancho);

        Plotly.relayout(grafico, cambios)
            .then(function () {
                Plotly.Plots.resize(grafico);
            });
    }

    function programarRedimension() {
        if (animacionPendiente !== null) {
            cancelAnimationFrame(animacionPendiente);
        }

        animacionPendiente = requestAnimationFrame(function () {
            animacionPendiente = null;
            redimensionar();
        });
    }

    if ("ResizeObserver" in window) {
        const observador = new ResizeObserver(programarRedimension);
        observador.observe(contenedor);
    }

    window.addEventListener("resize", programarRedimension, {passive: true});
    programarRedimension();
})();
</script>
