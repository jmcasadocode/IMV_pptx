var style = document.createElement('style');

        min-height: 500px !important; 
        min-width: 800px !important;

document.head.appendChild(style);

// 2. Función que habla con Plotly para actualizar la letra y los márgenes a la vez
function updatePlotlyFont() {
    var myPlot = document.getElementsByClassName('js-plotly-plot')[0];
    if (!myPlot) return;
    
    // Calculamos el tamaño ideal: mínimo 12px, y como máximo 25px
    var vw = window.innerWidth * 0.015;
    var vh = window.innerHeight * 0.03;
    var idealSize = Math.min(vw, vh);
    var finalSize = Math.max(12, Math.min(idealSize, 25));
    
    // Le pedimos a Plotly que actualice SU tamaño de fuente interno
    Plotly.relayout(myPlot, {
        'font.size': finalSize,
        'xaxis.tickfont.size': finalSize,
        'yaxis.tickfont.size': finalSize
    });
}

// Ejecutar inmediatamente en cuanto se abra el archivo
setTimeout(updatePlotlyFont, 150);

// Ejecutar cada vez que el usuario mueva o cambie el tamaño de la ventana
window.addEventListener('resize', function() {
    clearTimeout(window.fontResizeTimer);
    window.fontResizeTimer = setTimeout(updatePlotlyFont, 100); // Pequeña pausa para no saturar
});
